<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>My start page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <div class="container mt-4">
      <h2>Список людей</h2>
      
      {% if People_List %}
      <table class="table table-striped table-bordered">
        <thead class="table-ligth table-primary">
          <tr>
            <th >Имя</th>
            <th>Фамилия</th>
            <th>Отчество</th>
          </tr>
        </thead>
        <tbody>
          {% for men in People_List %}
          <tr>
            <td>{{ men.name }}</td>
            <td>{{ men.surname }}</td>
            <td>{{ men.lastname }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
      {% else %}
      <p>Нет данных для отображения</p>
      {% endif %}
      <a href="{% url 'polls:index' %}" class="btn btn-primary">На главную</a>
    </div>
  </body>
</html>
